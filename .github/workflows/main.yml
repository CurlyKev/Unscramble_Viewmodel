name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # This image includes Android SDK Platform 35 and Build-Tools 35.0.0.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
